name: 功能提案
description: 提议教学、测试或学习记录的新能力
title: "[提案] "
body:
  - type: textarea
    id: need
    attributes:
      label: 谁遇到了什么学习问题
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案与最小范围
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 如何验证学习体验或结果
