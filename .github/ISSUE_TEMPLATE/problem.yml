name: 问题反馈
description: 报告自定义课程、逐节讲解、测试或网页问题
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: "请提供复现步骤和预期结果；不要粘贴 API 密钥或个人学习记录。"
  - type: input
    id: location
    attributes:
      label: 所在页面或功能
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 实际问题与预期结果
      description: 请尽量说明运行环境和复现步骤。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 相关报错或建议修正
